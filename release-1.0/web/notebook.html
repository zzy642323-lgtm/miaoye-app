function friendList(){window.FriendRequests?.refresh(true);show('我的手账朋友',(window.FriendRequests?.html()||'')+'<p class="dialog-sub">翻翻朋友的生活，也给朋友留个位置。</p>'+peers.map(p=>'<div class="friend-row"><span class="avatar">'+esc(p.letter)+'</span><strong>'+esc(p.name)+'</strong><button data-open-peer="'+esc(p.name)+'">看手账 ↗</button></div>').join('')+'<button class="primary" data-add-friend>＋ 加一个手账朋友</button>')}
function addFriend(){window.FriendRequests?.add()}
document.addEventListener('click',e=>{const b=e.target.closest('button'),card=e.target.closest('[data-card]');if(card&&b?.dataset.entry){e.stopImmediatePropagation();detail(b.dataset.entry);return}if(card&&!card.classList.contains('active')){e.stopImmediatePropagation();deckIndex=Number(card.dataset.card);drawDeck();document.querySelector('.friend-deck .active')?.scrollIntoView({block:'center',behavior:'smooth'});return}if(!b)return;if(b.dataset.mode){notebookMode=b.dataset.mode;sessionStorage.setItem('notebookMode',notebookMode);render();return}if(b.dataset.deckStep){stepDeck(Number(b.dataset.deckStep));return}if(b.dataset.feedFilter){peerFilter=b.dataset.feedFilter;deckIndex=0;drawDeck();return}if(b.dataset.peer){peerFilter=b.dataset.peer;deckIndex=0;drawDeck();return}if(b.hasAttribute('data-friend-list'))friendList();if(b.hasAttribute('data-add-friend'))addFriend();if(b.dataset.openPeer){peerFilter=b.dataset.openPeer;deckIndex=0;panel.close();go('friends')}if(b.hasAttribute('data-cat-close')){catClosed=true;renderCat()}if(b.hasAttribute('data-cat-reopen')){catClosed=false;renderCat()}if(b.hasAttribute('data-cat-quips')){window.FriendCatChat?.next()}},true);


function folderShelf(){return '<div class="shelf-label"><span>我的生活收藏架 / 2026</span></div><div class="folder-grid">'+presentationBooks().map((b,i)=>'<button class="folder" style="--folder:'+['#f2ce43','#aab8d9','#f0a381','#b7c6a8'][i%4]+'" data-book="'+b.id+'"><span class="folder-photos">'+(bookPhotoSources(b).map(src=>photo(src,b.name+'的照片')).join('')||'<span class="empty-folder">等待你的照片</span>')+'</span><span class="folder-front"><h3>'+b.name+'</h3><small>'+entries.filter(e=>e.book===b.id).length+' 页 / 最近更新 '+b.date.replace(' 月 ','.').replace(' 日','')+'</small></span></button>').join('')+'</div><p class="shelf-end">长按卡片，调整本子的顺序。</p>'}

let calendarDay=9,calendarScope='day',dragState=null,dragClickUntil=0;
const collagePositions=JSON.parse(localStorage.getItem('miaoye-preview-collage')||sessionStorage.getItem('collagePositions')||'{}');let bookOrder=JSON.parse(localStorage.getItem('miaoye-preview-order')||sessionStorage.getItem('bookOrder')||'[]');
const freeBookOrder=JSON.parse(localStorage.getItem('miaoye-preview-free-book-order')||'null')||[...bookOrder,...books.map(b=>b.id).filter(id=>!bookOrder.includes(id))];localStorage.setItem('miaoye-preview-free-book-order',JSON.stringify(freeBookOrder));
function orderedBooks(order){return [...books].sort((a,b)=>{const ai=order.indexOf(a.id),bi=order.indexOf(b.id);return (ai<0?100+books.indexOf(a):ai)-(bi<0?100+books.indexOf(b):bi)})}
function presentationBooks(){if(notebookMode==='j')return orderedBooks(bookOrder);const missing=books.map(b=>b.id).filter(id=>!freeBookOrder.includes(id));if(missing.length){freeBookOrder.push(...missing);localStorage.setItem('miaoye-preview-free-book-order',JSON.stringify(freeBookOrder))}return orderedBooks(freeBookOrder)}
function bookLayer(id){return orderedBooks(bookOrder).findIndex(b=>b.id===id)+1}
function restoreCollage(){document.querySelectorAll('.book-object').forEach(b=>{const pos=collagePositions[b.dataset.book]||{};b.style.zIndex=String(bookLayer(b.dataset.book));b.style.translate=(pos.x||0)+'px '+(pos.y||0)+'px';b.querySelectorAll('.object-photo').forEach((ph,i)=>{ph.style.translate=(pos[i?'px2':'px']||0)+'px '+(pos[i?'py2':'py']||0)+'px'})})}
window.addEventListener('click',e=>{if(Date.now()<dragClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);

document.addEventListener('dragstart',e=>{if(e.target.closest('.book-object,.folder'))e.preventDefault()});
function activateDrag(){const d=dragState;if(!d||d.active)return;clearTimeout(d.timer);d.active=true;d.target.classList.add('dragging');d.target.style.touchAction='none';toast(notebookMode==='f'?'照片跟着本子走，松手就贴好':'拖到另一张卡片上，松手调整顺序')}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.book-object,.folder');if(!b||e.button!==0)return;const ph=e.target.closest('.object-photo'),target=notebookMode==='f'&&ph?ph:b;const key=b.dataset.book;dragState={b,target,key,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,active:false,isPhoto:target===ph,second:ph?.classList.contains("secondary"),positions:collagePositions[key]||{},pointer:e.pointerId,pointerType:e.pointerType};target.setPointerCapture(e.pointerId);dragState.timer=setTimeout(activateDrag,350)});
document.addEventListener('pointermove',e=>{const d=dragState;if(!d)return;d.lastX=e.clientX;d.lastY=e.clientY;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.active&&d.pointerType==='mouse'&&Math.hypot(dx,dy)>5)activateDrag();if(!d.active)return;e.preventDefault();if(notebookMode==='f'){const x=(d.positions[d.isPhoto?(d.second?'px2':'px'):'x']||0)+dx,y=(d.positions[d.isPhoto?(d.second?'py2':'py'):'y']||0)+dy;d.target.style.translate=x+'px '+y+'px'}else d.target.style.translate=dx+'px '+dy+'px'},{passive:false});
function finishDrag(e,cancel=false){const d=dragState;if(!d)return;clearTimeout(d.timer);dragState=null;if(!d.active)return;dragClickUntil=Date.now()+700;d.target.classList.remove('dragging');d.target.style.touchAction='';if(cancel){d.target.style.translate='';restoreCollage();return}if(notebookMode==='f'){const dx=d.lastX-d.x,dy=d.lastY-d.y;collagePositions[d.key]={...d.positions,[d.isPhoto?(d.second?'px2':'px'):'x']:(d.positions[d.isPhoto?(d.second?'px2':'px'):'x']||0)+dx,[d.isPhoto?(d.second?'py2':'py'):'y']:(d.positions[d.isPhoto?(d.second?'py2':'py'):'y']||0)+dy};sessionStorage.setItem('collagePositions',JSON.stringify(collagePositions));localStorage.setItem('miaoye-preview-collage',JSON.stringify(collagePositions));toast('拼贴位置已自动保存')}else{d.target.style.translate='';const cards=[...document.querySelectorAll('.folder')];const dest=cards.filter(c=>c!==d.b).map(c=>({c,r:c.getBoundingClientRect()})).sort((a,b)=>Math.hypot(d.lastX-(a.r.x+a.r.width/2),d.lastY-(a.r.y+a.r.height/2))-Math.hypot(d.lastX-(b.r.x+b.r.width/2),d.lastY-(b.r.y+b.r.height/2)))[0];if(dest&&d.lastX>=dest.r.left-25&&d.lastX<=dest.r.right+25&&d.lastY>=dest.r.top-25&&d.lastY<=dest.r.bottom+25){bookOrder=presentationBooks().map(b=>b.id);const from=bookOrder.indexOf(d.key),to=bookOrder.indexOf(dest.c.dataset.book);bookOrder.splice(from,1);bookOrder.splice(to,0,d.key);sessionStorage.setItem('bookOrder',JSON.stringify(bookOrder));localStorage.setItem('miaoye-preview-order',JSON.stringify(bookOrder));document.querySelector('#proposal-books #library-body').innerHTML=shelf();toast('顺序已调整')}}}
document.addEventListener('pointerup',e=>finishDrag(e));document.addEventListener('pointercancel',e=>finishDrag(e,true));
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-mode-toggle')){notebookMode=notebookMode==='f'?'j':'f';sessionStorage.setItem('notebookMode',notebookMode);render();return}if(b.dataset.calendarDay){calendarDay=Number(b.dataset.calendarDay);b.closest('.proposal').querySelector('#library-body').innerHTML=calendar();return}if(b.dataset.calendarScope){calendarScope=b.dataset.calendarScope;b.closest('.proposal').querySelector('#library-body').innerHTML=calendar();return}if(b.dataset.library==='books')restoreCollage()},true);

window.addEventListener('storage',e=>{if(e.key==='miaoye-preview-adoption')render()});
render();
