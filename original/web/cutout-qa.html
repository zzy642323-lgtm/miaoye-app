<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>本机抠图验证</title><style>body{font:18px sans-serif;background:#f8efd8}img{max-width:350px;vertical-align:top;background:repeating-conic-gradient(#ddd 0% 25%,white 0% 50%) 0/20px 20px}pre{white-space:pre-wrap}</style><h1>离线模型验证</h1><pre id="status">准备中</pre><main></main><script type="module">
import {toCanvas,loadImage,cutout} from './images.js';
const status=document.querySelector('#status');
try {const original='./assets/adventure-1-v8.webp',start=performance.now();const src=await cutout(original,(stage)=>status.textContent=stage);const image=await loadImage(src);const canvas=await toCanvas(src);const pixels=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;let clear=0,solid=0;for(let i=3;i<pixels.length;i+=4){if(pixels[i]<30)clear++;if(pixels[i]>220)solid++;}const n=pixels.length/4;if(clear<n*.1||solid<n*.03)throw new Error('未得到有效的透明主体');document.querySelector('main').append(Object.assign(new Image(),{src:original}),image);status.textContent=JSON.stringify({passed:true,seconds:Math.round((performance.now()-start)/1000),transparent:Math.round(clear/n*100)+'%',opaque:Math.round(solid/n*100)+'%',resources:performance.getEntriesByType('resource').map(x=>x.name)},null,2);}catch(error){status.textContent='FAILED: '+error.stack;}
</script></html>
